# Publishes to PyPI when a version tag (v*) is pushed, through PyPI trusted publishing: PyPI trusts this
# workflow in the `pypi` environment, so no API token is stored in the repository.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mini-web-agent
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; fi
      - name: Build
        run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
