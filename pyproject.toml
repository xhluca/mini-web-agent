[project]
name = "mini-web-agent"
version = "0.2.0"
description = "Explore how frontier models use a browser in about 400 lines of Python."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=2.0,<4", "playwright>=1.58,<2"]
keywords = ["web-agent", "browser", "llm", "playwright"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/xhluca/mini-web-agent"
Source = "https://github.com/xhluca/mini-web-agent"
Issues = "https://github.com/xhluca/mini-web-agent/issues"

[project.scripts]
mini-web-agent = "agent:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "install_chromium", "chat_completions"]
packages = ["callbacks"]

[tool.ruff]
line-length = 100
