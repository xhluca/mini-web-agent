[project]
name = "mini-web-agent"
version = "0.2.0"
description = "A screenshot-driven web agent with predefined Playwright actions and OpenAI Responses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=2.0,<4", "playwright>=1.58,<2"]

[project.scripts]
mini-web-agent = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "cursor", "cli"]

[tool.ruff]
line-length = 100
