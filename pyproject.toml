[project]
name = "mini-web-agent"
version = "0.2.0"
description = "Explore how frontier models use a browser in fewer than 400 lines of Python."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=2.0,<4", "playwright>=1.58,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent"]
packages = ["callbacks"]

[tool.ruff]
line-length = 100
